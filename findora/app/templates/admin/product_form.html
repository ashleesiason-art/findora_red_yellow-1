{% extends "admin/layout.html" %}{% block title %}{{ 'Edit' if p else 'New' }} product{% endblock %}
{% block content %}
<h1>{{ 'Edit product' if p else 'Add product' }}</h1>
<form method="post" class="box" style="max-width:700px">
  <label>Name</label><input type="text" name="name" value="{{ p.name if p }}" required>
  <label>Description</label><textarea name="description" rows="3">{{ p.description if p }}</textarea>
  <div class="row"><div><label>Selling price (₱)</label><input type="number" step="0.01" min="0" name="price" value="{{ p.price if p }}" required></div>
  <div><label>Original price (₱) — for discount badge</label><input type="number" step="0.01" min="0" name="original_price" value="{{ p.original_price if p }}"></div></div>
  <div class="row"><div><label>Stock</label><input type="number" min="0" name="stock" value="{{ p.stock if p else 0 }}" required></div>
  <div><label>Category</label><select name="category_id">{% for c in all_categories %}<option value="{{ c.id }}" {{ 'selected' if p and p.category_id == c.id }}>{{ c.name }}</option>{% endfor %}</select></div></div>
  <div class="row"><div><label>Emoji icon (temporary product image)</label><input type="text" name="emoji" value="{{ p.emoji if p else '📦' }}" maxlength="4"></div>
  <div><label>Background colour</label><input type="color" name="color" value="{{ p.color if p else '#fff3bf' }}" style="height:40px;width:100%"></div></div>
  <label><input type="checkbox" name="is_active" style="width:auto" {{ 'checked' if (not p) or p.is_active }}> Visible in store</label>
  <p><button class="btn">Save</button> <a class="btn gray" href="{{ url_for('admin_products') }}">Cancel</a></p>
</form>
{% endblock %}
