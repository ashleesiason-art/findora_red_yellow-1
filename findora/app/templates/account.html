{% extends "base.html" %}{% block title %}My Account - FINDORA{% endblock %}
{% block content %}<div class="box auth"><h2>My Profile</h2>
<form method="post"><label>Full name</label><input type="text" name="full_name" value="{{ user.full_name }}" required>
<label>Email</label><input type="email" value="{{ user.email }}" disabled>
<label>Phone</label><input type="tel" name="phone" value="{{ user.phone or '' }}">
<label>Default address</label><input type="text" name="address" value="{{ user.address or '' }}">
<p><button class="btn">Save</button></p></form></div>{% endblock %}
