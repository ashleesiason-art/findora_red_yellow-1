{% extends "base.html" %}{% block title %}Sign Up - FINDORA{% endblock %}
{% block content %}<div class="box auth"><h2>Sign Up</h2>
<form method="post"><label>Full name</label><input type="text" name="full_name" required>
<label>Email</label><input type="email" name="email" required>
<label>Phone</label><input type="tel" name="phone">
<label>Password (6+ characters)</label><input type="password" name="password" minlength="6" required>
<p><button class="btn" style="width:100%">SIGN UP</button></p></form>
<p>Have an account? <a style="color:var(--o)" href="{{ url_for('login') }}">Log In s</a></p></div>{% endblock %}
